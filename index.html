<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match-Up</title>

  <style>
    :root{
      --ink:#233142;
      --muted:#64748b;
      --border:#d9dee8;
      --accent:#2563eb;
      --good:#15803d;
      --bad:#b91c1c;
      --definition-panel:#f4f7ff;
      --image-panel:#fffaf2;
      --definition-back:#a61b1b;
      --image-back:#174ea6;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
    }

    .game{
      width:min(1180px,96vw);
      margin:0 auto;
      padding:22px 10px 32px;
    }

    header{
      text-align:center;
      margin-bottom:14px;
    }

    h1{
      margin:0;
      font-size:clamp(28px,4vw,42px);
      letter-spacing:.04em;
    }

    .instructions{
      margin:6px 0 0;
      color:var(--muted);
      font-size:16px;
    }

    .stats{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin:16px auto 20px;
    }

    .stat{
      background:white;
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 15px;
      font-size:14px;
      font-weight:700;
    }

    .stat span{ font-variant-numeric:tabular-nums; }

    .status{
      min-height:28px;
      text-align:center;
      font-weight:800;
      font-size:15px;
      margin:2px 0 16px;
    }

    .status.good{ color:var(--good); }
    .status.bad{ color:var(--bad); }
    .status.neutral{ color:var(--muted); }

    .load-error{
      display:none;
      max-width:900px;
      margin:0 auto 16px;
      padding:12px 14px;
      border:2px solid var(--bad);
      border-radius:12px;
      background:#fff;
      color:var(--bad);
      font-weight:700;
      text-align:center;
    }

    .load-error.show{ display:block; }

    .section{
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      margin:0 auto 18px;
    }

    .definition-area{ background:var(--definition-panel); }
    .image-area{ background:var(--image-panel); }

    .section-title{
      text-align:center;
      font-size:15px;
      font-weight:800;
      letter-spacing:.12em;
      margin-bottom:12px;
    }

    .section-subtitle{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin:-7px 0 13px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:14px;
      max-width:900px;
      margin:0 auto;
    }

    .card{
      position:relative;
      aspect-ratio:1 / 1;
      border:0;
      padding:0;
      background:transparent;
      perspective:900px;
      cursor:pointer;
      min-width:0;
      border-radius:18px;
    }

    .card:focus-visible{
      outline:4px solid #60a5fa;
      outline-offset:3px;
    }

    .card:disabled{ cursor:default; }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transition:transform .42s cubic-bezier(.2,.7,.2,1);
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-face{
      position:absolute;
      inset:0;
      border-radius:18px;
      overflow:hidden;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      box-shadow:0 4px 10px rgba(15,23,42,.16);
    }

    /* These backs are drawn entirely with CSS.
       No A_back.png or 1_back.png is needed. */
    .card-back{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:white;
      border:4px solid rgba(255,255,255,.8);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.18),
        0 4px 10px rgba(15,23,42,.18);
      text-align:center;
      padding:10px;
    }

    .definition-card .card-back{
      background:
        radial-gradient(circle at center, rgba(255,255,255,.12) 0 18%, transparent 19%),
        linear-gradient(135deg,#8f1717,#bd2626);
    }

    .image-card .card-back{
      background:
        radial-gradient(circle at center, rgba(255,255,255,.12) 0 18%, transparent 19%),
        linear-gradient(135deg,#123b80,#2060c0);
    }

    .back-symbol{
      display:block;
      font-size:clamp(28px,5vw,58px);
      font-weight:900;
      line-height:1;
      text-shadow:0 2px 4px rgba(0,0,0,.2);
    }

    .back-label{
      display:block;
      margin-top:8px;
      font-size:clamp(9px,1.5vw,15px);
      font-weight:900;
      letter-spacing:.14em;
    }

    .card-front{
      transform:rotateY(180deg);
      background:white;
      border:1px solid var(--border);
    }

    .card-front img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      background:white;
    }

    .card.selected .card-face{
      box-shadow:0 0 0 4px var(--accent),0 7px 16px rgba(15,23,42,.18);
    }

    .card.matched .card-face{
      box-shadow:0 0 0 4px var(--good),0 7px 16px rgba(22,163,74,.16);
    }

    .card.matched::after{
      content:"✓ MATCH";
      position:absolute;
      left:50%;
      bottom:8px;
      transform:translateX(-50%);
      background:var(--good);
      color:white;
      font-size:11px;
      font-weight:800;
      padding:4px 8px;
      border-radius:999px;
      pointer-events:none;
      z-index:5;
      white-space:nowrap;
    }

    .controls{
      text-align:center;
      margin-top:2px;
    }

    .restart{
      border:0;
      border-radius:999px;
      background:var(--ink);
      color:white;
      padding:11px 20px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .restart:hover{ filter:brightness(1.08); }

    .result{
      display:none;
      text-align:center;
      background:white;
      border:1px solid var(--border);
      border-radius:20px;
      padding:20px;
      margin:16px auto 0;
      max-width:520px;
    }

    .result.show{ display:block; }

    .result h2{ margin:0 0 8px; }
    .result p{ margin:5px 0; color:var(--muted); }
    .score{
      font-size:28px;
      font-weight:900;
      color:var(--ink) !important;
    }

    @media(max-width:760px){
      .game{ width:98vw; padding:15px 4px 24px; }
      .section{ padding:10px; border-radius:16px; }
      .cards{ gap:9px; }
      .card-face,.card{ border-radius:13px; }
      .card.matched::after{
        font-size:8px;
        bottom:4px;
        padding:3px 5px;
      }
      .instructions{ font-size:14px; }
    }

    @media(max-width:500px){
      .cards{
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:5px;
      }

      .stats{ gap:6px; }
      .stat{ padding:6px 9px; font-size:12px; }

      .back-label{
        font-size:7px;
        letter-spacing:.08em;
      }
    }

    @media(prefers-reduced-motion:reduce){
      .card-inner{ transition:none; }
    }
  </style>
</head>

<body>
  <main class="game">
    <header>
      <h1>MATCH-UP</h1>
      <p class="instructions">Choose a definition, then find the picture that matches it.</p>

      <div class="stats" aria-label="Game statistics">
        <div class="stat">Matches: <span id="matches">0</span>/10</div>
        <div class="stat">Moves: <span id="moves">0</span></div>
        <div class="stat">Mistakes: <span id="mistakes">0</span></div>
        <div class="stat">Score: <span id="score">1000</span></div>
      </div>
    </header>

    <div class="load-error" id="loadError"></div>

    <div class="status neutral" id="status" aria-live="polite">
      Choose a definition to begin.
    </div>

    <section class="section definition-area" aria-labelledby="definitionsTitle">
      <div class="section-title" id="definitionsTitle">DEFINITIONS • A–J</div>
      <div class="section-subtitle">Choose any red card.</div>
      <div class="cards" id="definitionCards"></div>
    </section>

    <section class="section image-area" aria-labelledby="imagesTitle">
      <div class="section-title" id="imagesTitle">IMAGES • 1–10</div>
      <div class="section-subtitle">Then choose a blue picture card.</div>
      <div class="cards" id="imageCards"></div>
    </section>

    <div class="controls">
      <button class="restart" id="restart" type="button">New Game</button>
    </div>

    <section class="result" id="result" aria-live="polite">
      <h2>All 10 Matches!</h2>
      <p id="resultSummary"></p>
      <p class="score">Score: <span id="finalScore">0</span></p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      /*
        ANSWER KEY
        If your actual matches are different, only change these ten lines.
      */
      const PAIRS = [
        { definition: "A", image: "01" },
        { definition: "B", image: "02" },
        { definition: "C", image: "03" },
        { definition: "D", image: "04" },
        { definition: "E", image: "05" },
        { definition: "F", image: "06" },
        { definition: "G", image: "07" },
        { definition: "H", image: "08" },
        { definition: "I", image: "09" },
        { definition: "J", image: "10" }
      ];

      const definitionCardsEl = document.getElementById("definitionCards");
      const imageCardsEl = document.getElementById("imageCards");
      const matchesEl = document.getElementById("matches");
      const movesEl = document.getElementById("moves");
      const mistakesEl = document.getElementById("mistakes");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");
      const restartBtn = document.getElementById("restart");
      const resultEl = document.getElementById("result");
      const resultSummaryEl = document.getElementById("resultSummary");
      const finalScoreEl = document.getElementById("finalScore");
      const loadErrorEl = document.getElementById("loadError");

      let selectedDefinitionId = null;
      let selectedDefinitionCard = null;
      let matches = 0;
      let moves = 0;
      let mistakes = 0;
      let score = 1000;
      let locked = false;
      const failedImages = new Set();

      function shuffle(items) {
        const copy = [...items];

        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy;
      }

      function setStatus(message, kind = "neutral") {
        statusEl.textContent = message;
        statusEl.className = `status ${kind}`;
      }

      function reportImageFailure(filename) {
        failedImages.add(filename);
        const list = [...failedImages].join(", ");
        loadErrorEl.innerHTML =
          `Could not load: <strong>${list}</strong><br>` +
          `These files should be inside the repository's <strong>images</strong> folder.`;
        loadErrorEl.classList.add("show");
      }

      function makeFrontImage(type, id) {
        const filename = `${id}.png`;
        const img = document.createElement("img");

        img.src = `./images/${filename}`;
        img.alt =
          type === "definition"
            ? `Definition ${id}`
            : `Picture ${Number(id)}`;

        img.draggable = false;

        img.addEventListener(
          "error",
          () => reportImageFailure(filename),
          { once:true }
        );

        return img;
      }

      function createCard(type, id) {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          `card ${type === "definition" ? "definition-card" : "image-card"}`;
        button.dataset.type = type;
        button.dataset.id = id;

        const inner = document.createElement("span");
        inner.className = "card-inner";

        const back = document.createElement("span");
        back.className = "card-face card-back";

        const symbol = document.createElement("span");
        symbol.className = "back-symbol";
        symbol.textContent = "?";

        const label = document.createElement("span");
        label.className = "back-label";
        label.textContent =
          type === "definition" ? "DEFINITION" : "PICTURE";

        back.append(symbol, label);

        const front = document.createElement("span");
        front.className = "card-face card-front";
        front.appendChild(makeFrontImage(type, id));

        inner.append(back, front);
        button.appendChild(inner);

        button.addEventListener("click", () => handleCardClick(button));

        return button;
      }

      function renderCards() {
        definitionCardsEl.replaceChildren();
        imageCardsEl.replaceChildren();

        shuffle(PAIRS.map(pair => pair.definition)).forEach(id => {
          definitionCardsEl.appendChild(createCard("definition", id));
        });

        shuffle(PAIRS.map(pair => pair.image)).forEach(id => {
          imageCardsEl.appendChild(createCard("image", id));
        });
      }

      function flip(card) {
        card.classList.add("flipped");
      }

      function unflip(card) {
        card.classList.remove("flipped", "selected");
      }

      function expectedImageFor(definitionId) {
        const pair = PAIRS.find(item => item.definition === definitionId);
        return pair ? pair.image : null;
      }

      function selectDefinition(card) {
        if (selectedDefinitionCard && selectedDefinitionCard !== card) {
          unflip(selectedDefinitionCard);
        }

        selectedDefinitionId = card.dataset.id;
        selectedDefinitionCard = card;

        flip(card);
        card.classList.add("selected");

        setStatus(
          `Definition ${selectedDefinitionId} selected. Now find its matching picture.`
        );
      }

      function handleCardClick(card) {
        if (locked || card.classList.contains("matched")) return;

        const type = card.dataset.type;

        if (type === "definition") {
          if (card === selectedDefinitionCard) return;
          selectDefinition(card);
          return;
        }

        if (!selectedDefinitionCard) {
          setStatus("Choose a definition first.", "bad");
          return;
        }

        moves += 1;
        movesEl.textContent = String(moves);

        flip(card);
        locked = true;

        const isMatch =
          card.dataset.id === expectedImageFor(selectedDefinitionId);

        if (isMatch) {
          matches += 1;
          score += 100;

          matchesEl.textContent = String(matches);
          scoreEl.textContent = String(score);

          selectedDefinitionCard.classList.remove("selected");
          selectedDefinitionCard.classList.add("matched");
          selectedDefinitionCard.disabled = true;

          card.classList.add("matched");
          card.disabled = true;

          setStatus(
            `Match! Definition ${selectedDefinitionId} matches picture ${Number(card.dataset.id)}.`,
            "good"
          );

          selectedDefinitionId = null;
          selectedDefinitionCard = null;
          locked = false;

          if (matches === PAIRS.length) {
            finishGame();
          }

          return;
        }

        mistakes += 1;
        score = Math.max(0, score - 25);

        mistakesEl.textContent = String(mistakes);
        scoreEl.textContent = String(score);

        setStatus("Not a match. Try another picture.", "bad");

        window.setTimeout(() => {
          unflip(card);
          locked = false;

          setStatus(
            `Definition ${selectedDefinitionId} is still selected. Try another picture.`
          );
        }, 900);
      }

      function finishGame() {
        let bonus = 0;

        if (mistakes === 0) bonus += 250;

        if (moves <= 15) {
          bonus += 250;
        } else if (moves <= 20) {
          bonus += 150;
        }

        score += bonus;

        scoreEl.textContent = String(score);
        finalScoreEl.textContent = String(score);

        const mistakeText =
          mistakes === 1 ? "1 mistake" : `${mistakes} mistakes`;

        resultSummaryEl.textContent =
          `You found every match in ${moves} moves with ${mistakeText}.`;

        resultEl.classList.add("show");
        setStatus("Excellent! You found all 10 matches!", "good");
      }

      function startGame() {
        selectedDefinitionId = null;
        selectedDefinitionCard = null;
        matches = 0;
        moves = 0;
        mistakes = 0;
        score = 1000;
        locked = false;
        failedImages.clear();

        matchesEl.textContent = "0";
        movesEl.textContent = "0";
        mistakesEl.textContent = "0";
        scoreEl.textContent = "1000";

        resultEl.classList.remove("show");
        loadErrorEl.classList.remove("show");
        loadErrorEl.textContent = "";

        renderCards();
        setStatus("Choose a definition to begin.");
      }

      restartBtn.addEventListener("click", startGame);
      startGame();
    })();
  </script>
</body>
</html>
