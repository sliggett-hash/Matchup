<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match-Up</title>

  <style>
    :root{
      --ink:#233142;
      --muted:#64748b;
      --border:#d9dee8;
      --accent:#2563eb;
      --good:#15803d;
      --bad:#dc2626;
      --definition-panel:#f4f7ff;
      --image-panel:#fffaf2;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
    }

    .game{
      width:min(1180px,96vw);
      margin:0 auto;
      padding:22px 10px 32px;
    }

    header{
      text-align:center;
      margin-bottom:14px;
    }

    h1{
      margin:0;
      font-size:clamp(28px,4vw,42px);
      letter-spacing:.04em;
    }

    .instructions{
      margin:6px 0 0;
      color:var(--muted);
      font-size:16px;
    }

    .stats{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin:16px auto 20px;
    }

    .stat{
      background:white;
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 15px;
      font-size:14px;
      font-weight:700;
    }

    .status{
      min-height:28px;
      text-align:center;
      font-weight:800;
      font-size:15px;
      margin:2px 0 16px;
    }

    .status.good{ color:var(--good); }
    .status.bad{ color:var(--bad); }
    .status.neutral{ color:var(--muted); }

    .load-error{
      display:none;
      max-width:900px;
      margin:0 auto 16px;
      padding:12px 14px;
      border:2px solid var(--bad);
      border-radius:12px;
      background:white;
      color:var(--bad);
      font-weight:700;
      text-align:center;
    }

    .load-error.show{ display:block; }

    .section{
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      margin:0 auto 18px;
    }

    .definition-area{ background:var(--definition-panel); }
    .image-area{ background:var(--image-panel); }

    .section-title{
      text-align:center;
      font-size:15px;
      font-weight:800;
      letter-spacing:.12em;
      margin-bottom:12px;
    }

    .section-subtitle{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin:-7px 0 13px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:14px;
      max-width:900px;
      margin:0 auto;
    }

    .card{
      position:relative;
      aspect-ratio:1/1;
      min-width:0;
      padding:0;
      border:2px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      background:white;
      cursor:pointer;
      box-shadow:0 3px 8px rgba(15,23,42,.10);
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .card:hover:not(:disabled){
      transform:translateY(-2px);
      box-shadow:0 7px 16px rgba(15,23,42,.15);
    }

    .card:focus-visible{
      outline:4px solid #60a5fa;
      outline-offset:3px;
    }

    .card img{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      background:white;
    }

    .card.selected{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(37,99,235,.28), 0 7px 16px rgba(15,23,42,.15);
    }

    .card.matched{
      border-color:var(--good);
      box-shadow:0 0 0 4px rgba(21,128,61,.25), 0 7px 16px rgba(15,23,42,.13);
      cursor:default;
    }

    .card.wrong{
      border-color:var(--bad);
      box-shadow:0 0 0 4px rgba(220,38,38,.25);
    }

    .card.matched::after{
      content:"✓ MATCH";
      position:absolute;
      left:50%;
      bottom:7px;
      transform:translateX(-50%);
      background:var(--good);
      color:white;
      font-size:11px;
      font-weight:800;
      padding:4px 8px;
      border-radius:999px;
      white-space:nowrap;
      pointer-events:none;
    }

    .card:disabled{
      opacity:.78;
    }

    .controls{
      text-align:center;
      margin-top:2px;
    }

    .restart{
      border:0;
      border-radius:999px;
      background:var(--ink);
      color:white;
      padding:11px 20px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .restart:hover{
      filter:brightness(1.08);
    }

    .result{
      display:none;
      text-align:center;
      background:white;
      border:1px solid var(--border);
      border-radius:20px;
      padding:20px;
      margin:16px auto 0;
      max-width:520px;
    }

    .result.show{ display:block; }
    .result h2{ margin:0 0 8px; }
    .result p{ margin:5px 0; color:var(--muted); }

    .score{
      font-size:28px;
      font-weight:900;
      color:var(--ink) !important;
    }

    @media(max-width:760px){
      .game{
        width:98vw;
        padding:15px 4px 24px;
      }

      .section{
        padding:10px;
        border-radius:16px;
      }

      .cards{
        gap:8px;
      }

      .card{
        border-radius:11px;
      }

      .card.matched::after{
        font-size:8px;
        bottom:4px;
        padding:3px 5px;
      }
    }

    @media(max-width:500px){
      .cards{
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:4px;
      }

      .stats{
        gap:6px;
      }

      .stat{
        padding:6px 9px;
        font-size:12px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header>
      <h1>MATCH-UP</h1>
      <p class="instructions">Choose a definition, then choose the picture that matches it.</p>

      <div class="stats">
        <div class="stat">Matches: <span id="matches">0</span>/10</div>
        <div class="stat">Moves: <span id="moves">0</span></div>
        <div class="stat">Mistakes: <span id="mistakes">0</span></div>
        <div class="stat">Score: <span id="score">1000</span></div>
      </div>
    </header>

    <div class="load-error" id="loadError"></div>

    <div class="status neutral" id="status" aria-live="polite">
      Choose a definition to begin.
    </div>

    <section class="section definition-area">
      <div class="section-title">DEFINITIONS • A–J</div>
      <div class="section-subtitle">Click the definition you want to match.</div>
      <div class="cards" id="definitionCards"></div>
    </section>

    <section class="section image-area">
      <div class="section-title">IMAGES • 1–10</div>
      <div class="section-subtitle">Then click the matching picture.</div>
      <div class="cards" id="imageCards"></div>
    </section>

    <div class="controls">
      <button class="restart" id="restart" type="button">New Game</button>
    </div>

    <section class="result" id="result" aria-live="polite">
      <h2>All 10 Matches!</h2>
      <p id="resultSummary"></p>
      <p class="score">Score: <span id="finalScore">0</span></p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const PAIRS = [
        { definition:"A", image:"01" },
        { definition:"B", image:"02" },
        { definition:"C", image:"03" },
        { definition:"D", image:"04" },
        { definition:"E", image:"05" },
        { definition:"F", image:"06" },
        { definition:"G", image:"07" },
        { definition:"H", image:"08" },
        { definition:"I", image:"09" },
        { definition:"J", image:"10" }
      ];

      const definitionCardsEl = document.getElementById("definitionCards");
      const imageCardsEl = document.getElementById("imageCards");
      const matchesEl = document.getElementById("matches");
      const movesEl = document.getElementById("moves");
      const mistakesEl = document.getElementById("mistakes");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");
      const restartBtn = document.getElementById("restart");
      const resultEl = document.getElementById("result");
      const resultSummaryEl = document.getElementById("resultSummary");
      const finalScoreEl = document.getElementById("finalScore");
      const loadErrorEl = document.getElementById("loadError");

      let selectedDefinition = null;
      let selectedDefinitionCard = null;
      let matches = 0;
      let moves = 0;
      let mistakes = 0;
      let score = 1000;
      let locked = false;
      const failedImages = new Set();

      function shuffle(items){
        const copy = [...items];

        for(let i = copy.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy;
      }

      function setStatus(message, kind="neutral"){
        statusEl.textContent = message;
        statusEl.className = `status ${kind}`;
      }

      function reportImageFailure(filename){
        failedImages.add(filename);

        loadErrorEl.innerHTML =
          `Could not load: <strong>${[...failedImages].join(", ")}</strong>`;

        loadErrorEl.classList.add("show");
      }

      function createCard(type, id){
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.dataset.type = type;
        card.dataset.id = id;

        const img = document.createElement("img");
        img.src = `./images/${id}.png`;
        img.alt =
          type === "definition"
            ? `Definition ${id}`
            : `Picture ${Number(id)}`;

        img.draggable = false;

        img.addEventListener(
          "error",
          () => reportImageFailure(`${id}.png`),
          { once:true }
        );

        card.appendChild(img);
        card.addEventListener("click", () => handleCardClick(card));

        return card;
      }

      function renderCards(){
        definitionCardsEl.replaceChildren();
        imageCardsEl.replaceChildren();

        shuffle(PAIRS.map(pair => pair.definition)).forEach(id => {
          definitionCardsEl.appendChild(createCard("definition", id));
        });

        shuffle(PAIRS.map(pair => pair.image)).forEach(id => {
          imageCardsEl.appendChild(createCard("image", id));
        });
      }

      function expectedImageFor(definitionId){
        const pair = PAIRS.find(pair => pair.definition === definitionId);
        return pair ? pair.image : null;
      }

      function selectDefinition(card){
        if(selectedDefinitionCard){
          selectedDefinitionCard.classList.remove("selected");
        }

        selectedDefinition = card.dataset.id;
        selectedDefinitionCard = card;
        card.classList.add("selected");

        setStatus(
          `Definition ${selectedDefinition} selected. Choose its matching picture.`
        );
      }

      function handleCardClick(card){
        if(locked || card.classList.contains("matched")) return;

        if(card.dataset.type === "definition"){
          selectDefinition(card);
          return;
        }

        if(!selectedDefinitionCard){
          setStatus("Choose a definition first.", "bad");
          return;
        }

        moves += 1;
        movesEl.textContent = String(moves);

        const isMatch =
          card.dataset.id === expectedImageFor(selectedDefinition);

        if(isMatch){
          matches += 1;
          score += 100;

          matchesEl.textContent = String(matches);
          scoreEl.textContent = String(score);

          selectedDefinitionCard.classList.remove("selected");
          selectedDefinitionCard.classList.add("matched");
          selectedDefinitionCard.disabled = true;

          card.classList.add("matched");
          card.disabled = true;

          setStatus(
            `Match! Definition ${selectedDefinition} matches picture ${Number(card.dataset.id)}.`,
            "good"
          );

          selectedDefinition = null;
          selectedDefinitionCard = null;

          if(matches === PAIRS.length){
            finishGame();
          }

          return;
        }

        mistakes += 1;
        score = Math.max(0, score - 25);

        mistakesEl.textContent = String(mistakes);
        scoreEl.textContent = String(score);

        locked = true;
        card.classList.add("wrong");

        setStatus(
          `Not a match. Definition ${selectedDefinition} is still selected.`,
          "bad"
        );

        window.setTimeout(() => {
          card.classList.remove("wrong");
          locked = false;
        }, 500);
      }

      function finishGame(){
        let bonus = 0;

        if(mistakes === 0) bonus += 250;

        if(moves <= 15){
          bonus += 250;
        } else if(moves <= 20){
          bonus += 150;
        }

        score += bonus;

        scoreEl.textContent = String(score);
        finalScoreEl.textContent = String(score);

        const mistakeText =
          mistakes === 1 ? "1 mistake" : `${mistakes} mistakes`;

        resultSummaryEl.textContent =
          `You found every match in ${moves} moves with ${mistakeText}.`;

        resultEl.classList.add("show");
        setStatus("Excellent! You found all 10 matches!", "good");
      }

      function startGame(){
        selectedDefinition = null;
        selectedDefinitionCard = null;
        matches = 0;
        moves = 0;
        mistakes = 0;
        score = 1000;
        locked = false;
        failedImages.clear();

        matchesEl.textContent = "0";
        movesEl.textContent = "0";
        mistakesEl.textContent = "0";
        scoreEl.textContent = "1000";

        resultEl.classList.remove("show");
        loadErrorEl.classList.remove("show");
        loadErrorEl.textContent = "";

        renderCards();
        setStatus("Choose a definition to begin.");
      }

      restartBtn.addEventListener("click", startGame);
      startGame();
    })();
  </script>
</body>
</html>
